<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANI.OS // STUDIO</title>
    <script>
      // Store the path and redirect to the index page
      // This enables GitHub Pages to serve SPAs correctly
      const path = window.location.pathname;
      if (path && path !== '/ani-os/') {
        sessionStorage.redirect = path;
      }
      window.location.href = '/ani-os/';
    </script>
  </head>

</html>
